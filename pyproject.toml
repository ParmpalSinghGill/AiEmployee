[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee"
version = "0.1.0"
description = "A production-grade, provider-independent AI Employee framework (multi-agent, LangGraph-orchestrated)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AI Employee Framework" }]
keywords = ["ai", "agents", "langchain", "langgraph", "llm", "rag", "automation"]

[project.scripts]
ai-employee = "ai_employee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_employee" = ["py.typed", "api/static/*.html", "api/static/*.css", "api/static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that need Postgres/Redis or network",
    "live: tests that call a real LLM provider (needs API keys)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = [
    "E501",      # line length handled by formatter
    "B008",      # clashes with FastAPI Depends() defaults
    "UP042",     # str+Enum is intentional (broad serialization compatibility)
    "ASYNC109",  # explicit timeout params are part of the tool API surface
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
