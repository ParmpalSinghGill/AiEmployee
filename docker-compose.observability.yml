# Observability stack for AI Employee.
#
#   app ──OTLP/HTTP :4318──▶ otel-collector ─┬─ traces ──▶ tempo       (:3200)
#                                            ├─ metrics ─▶ prometheus  (:9090, scrapes collector :8889)
#                                            └─ logs ────▶ loki        (:3100)
#   grafana (:3000) reads all three; the "AI Employee" dashboard is provisioned.
#
# start_server.sh brings this up automatically (OBSERVABILITY=0 to skip) and
# starts the app with OTEL_ENABLED=true. Manual use:
#   docker compose -f docker-compose.observability.yml up -d
#   docker compose -f docker-compose.observability.yml ps
#   docker compose -f docker-compose.observability.yml down        # keep data
#   docker compose -f docker-compose.observability.yml down -v     # wipe data
#
# Host ports are overridable: GRAFANA_PORT, PROMETHEUS_PORT, LOKI_PORT,
# TEMPO_PORT, OTLP_GRPC_PORT, OTLP_HTTP_PORT.
name: aiemployee-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP (the app sends here)
    depends_on: [tempo, loki]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver   # Tempo's service-graph / span metrics
      - --enable-feature=exemplar-storage    # metric → trace links
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    user: "0"   # local-dev volume permissions (image runs as 10001 by default)
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Local dev: open dashboards without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-employee.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
