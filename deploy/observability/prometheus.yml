global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # App metrics: pushed over OTLP to the collector, exposed on :8889.
  - job_name: ai-employee
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
